<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>

<div x-data="{ aberto: false, texto: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vestibulum luctus fermentum dui, nec malesuada eros dignissim eget. Sed id ullamcorper nulla. Duis vitae velit eget orci hendrerit placerat.' }">

    <p>
        <span x-text="aberto ? texto : texto.substring(0, 80) + '...'"></span>
    </p>

    <button class="btn" @click="aberto = !aberto">
        <span x-text="aberto ? 'Ler menos' : 'Ler mais'"></span>
    </button>

</div>

</body>
</html>
