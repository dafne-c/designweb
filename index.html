<div x-data="{ tags: ['HTML'], new: '' }">

    <input x-model="new" @keydown.enter="tags.push(new); new=''">

    <template x-for="tag in tags">

        <span class="badge"> 

            <span x-text="tag"></span>
            <button @click="tags = tags.filter(t => t !== tag)">X</button>

        </span>

    </template>

</div>
