<!-- 

-  breakpoints (pontos de parada)

>> sm | md | lg | xl | 2xl ...
>> rem - tamanho da fonte do html (o elemento mais ancestral)
1 rem = 100% da fonte
fonte 16px = 1 * rem 
fonte 1.5 rem  = 1.5 * fonte (24px)


-  tipografias

tamanho - text-[tamanho] | base | sm | md 
alinhamentos - text-center | right | left
peso - font-bold | light | extrabold | semibold
cores - text-[cor]-[nível]


-  box model

>> são multiplicados por uma fração do rem (25%)

border - border = 4px | border-[cor]-[nivel] | border-[espessura]
rounded - rounded-sm | md | lg | xl | 2xl ...
shadow - shadow-sm | md | lg | xl | 2xl ...
padding - p-1 = 4px
margin - m-1 = 4px
content

====== posicionamento ======

flex - .flex
justify | align
gap - gap-1 ()
grid - .grid grid-cols-3 md:grid-cols-2
