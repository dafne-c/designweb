<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <title>Calculadora freelancer</title>

</head>

<body class="flex bg-base-200 p-6 min-h-screen justify-center items-center">

  <div x-data="{
    nome: '',
    valor: 0,
    servicos: [],
    get total(){
      let v = 0;
        for (let item of this.servicos){
          v += item.valor
        }
      return v
    }
  }">

    <h1 class="font-bold my-2"> Calculadora </h1>

    <div class="flex gap-4">
      <input type="text" class="max-h-6 rounded px-2 py-4" x-model="nome">
      <input type="text" class="max-h-6 rounded px-2 py-4" x-model.number="valor">
      <button class="btn bg-pink-500 text-white" @click="servicos.push({ nome, valor }); nome='', valor=0"> Adicionar </button>

    </div>

    <div>

      <template x-for="item in servicos">

        <div class="flex gap-1">
          
          <p x-text="item.nome"> </p>
          <p x-text="item.valor"> </p>

        </div>

      </template>
      
      <p class="font-semibold text-gray-700">
        TOTAL: <span x-text="total"></span> R$
      </p>

    </div>

  </div>
</body>

</html>
