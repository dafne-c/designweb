<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <title>Calculadora freelancer</title>
</head>

<body>

  <div x-data="{
    nome: '',
    valor: 0,
    servicos: []
  }">

    <h1> Calculadora </h1>

    <input type="text" x-model="nome">
    <input type="text" x-model.number="valor">
    <button class="btn" @click="servicos.push({ nome, valor }); nome='', valor=0"> Adicionar </button>

    
    <template x-for="item in servicos">
      <p x-text="nome"> </p>
      <p x-text="valor"> </p>
    </template>


  </div>
</body>

</html>
